[workspace]
members = ["toenctl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["airscripts"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tiktoken-rs = "0.12"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
