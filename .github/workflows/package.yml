name: Package Release

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: rust:1.89-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
      options: --user root

    steps:
      - uses: actions/checkout@v7
        name: Checkout Release Ref

        with:
          ref: ${{ inputs.ref }}

      - run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
        name: Prepare Container Runtime

      - run: cargo run --release --locked --bin toenctl -- package --version "$RELEASE_VERSION"
        name: Create Release Archives

        env:
          CARGO_BUILD_JOBS: 4
          RELEASE_VERSION: ${{ inputs.version }}

      - uses: actions/upload-artifact@v7
        name: Upload Release Archives

        with:
          name: toen-v${{ inputs.version }}-archives
          path: dist/
          if-no-files-found: error
