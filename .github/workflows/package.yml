name: Package Release

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: rust:1.89-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
      options: --user root

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout Release Ref

        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates unzip && rm -rf /var/lib/apt/lists/*
        name: Prepare Container Runtime

      - run: cargo run --release --locked --bin toenctl -- package --version "$RELEASE_VERSION"
        name: Create Release Archives

        env:
          CARGO_BUILD_JOBS: 4
          RELEASE_VERSION: ${{ inputs.version }}

      - run: |
          set -eu
          for archive in dist/*.zip; do
            unzip -t "$archive"
          done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
        name: Validate Release Archives

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        name: Upload Release Archives

        with:
          name: toen-v${{ inputs.version }}-archives
          path: dist/
          if-no-files-found: error
