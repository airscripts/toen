name: Container

on:
  workflow_call:

permissions:
  contents: read

jobs:
  disposable:
    name: Disposable Container
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout Code

      - run: docker build --pull --file Containerfile --tag toen-ci:${{ github.sha }} .
        name: Build Container Image

      - run: docker run --rm --name toen-ci-${{ github.run_id }} toen-ci:${{ github.sha }}
        name: Run Verification In Disposable Container
