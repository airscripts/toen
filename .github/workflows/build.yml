name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-container:
    name: Linux Container
    runs-on: ubuntu-latest
    container:
      image: rust:1.89-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
      options: --user root
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates
          rm -rf /var/lib/apt/lists/*
        name: Prepare Container Runtime

      - run: cargo build --release --locked
        name: Build Release Binary
        env:
          CARGO_BUILD_JOBS: 4

      - run: cargo run --release --bin toenctl -- version
        name: Smoke Test Version

  native:
    name: Native
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

      - uses: dtolnay/rust-toolchain@1.89
        name: Install Rust Toolchain

      - uses: Swatinem/rust-cache@v2
        name: Cache Cargo

      - run: cargo build --release --locked
        name: Build Release Binary
        env:
          CARGO_BUILD_JOBS: 4

      - run: cargo run --release --bin toenctl -- version
        name: Smoke Test Version
