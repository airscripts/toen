name: Check Release Checksums

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Checksum
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        name: Download Release Archives

        with:
          name: toen-v${{ inputs.version }}-archives
          path: dist

      - run: |
          set -euo pipefail

          cd dist

          mapfile -t release_files < <(find . -maxdepth 1 -type f | sort)
          if [[ "${#release_files[@]}" -ne 4 && "${#release_files[@]}" -ne 6 ]]; then
            echo "expected four core release files or six files with benchmark evidence" >&2
            printf '%s\n' "${release_files[@]}" >&2
            exit 1
          fi

          sha256sum --check "toen-v${RELEASE_VERSION}-checksums.txt"

          test -f "toen-skill-v${RELEASE_VERSION}.zip"
          test -f "toen-codex-plugin-v${RELEASE_VERSION}.zip"
          test -f "toen-claude-code-plugin-v${RELEASE_VERSION}.zip"
          test -f "toen-v${RELEASE_VERSION}-checksums.txt"

          if [[ "${#release_files[@]}" -eq 6 ]]; then
            test -f "toen-benchmark-evidence-v${RELEASE_VERSION}.zip"
            test -f "toen-benchmark-report-v${RELEASE_VERSION}.md"
          fi

        name: Verify Release Checksums

        env:
          RELEASE_VERSION: ${{ inputs.version }}
