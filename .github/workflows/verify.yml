name: Verify

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  rust-container:
    name: Linux Container
    runs-on: ubuntu-latest
    container:
      image: rust:1.89-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
      options: --user root
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

        with:
          ref: ${{ inputs.ref || github.ref }}

      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl make python3 unzip
          rustup component add rustfmt clippy
          rm -rf /var/lib/apt/lists/*
        name: Prepare Container Runtime

      - run: cargo fmt --check
        name: Check Formatting

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        name: Lint Code

      - run: cargo check --workspace --locked
        name: Check Compilation

        env:
          CARGO_BUILD_JOBS: 4

      - run: cargo run --release --locked --bin toenctl -- corpus check
        name: Check Corpus

        env:
          CARGO_BUILD_JOBS: 4

      - run: cargo run --release --locked --bin toenctl -- sources verify --metadata-only
        name: Check Sources Metadata

        env:
          CARGO_BUILD_JOBS: 4

      - run: cargo run --release --locked --bin toenctl -- manifests check
        name: Check Plugin Manifests

        env:
          CARGO_BUILD_JOBS: 4

      - run: cargo run --release --locked --bin toenctl -- generate --check
        name: Check Generated Assets

        env:
          CARGO_BUILD_JOBS: 4
