name: Prepare Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

      prerelease:
        value: ${{ jobs.release.outputs.prerelease }}

      tag:
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: read

jobs:
  release:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout Release Ref

        with:
          ref: ${{ inputs.tag }}

      - id: release
        run: |
          set -euo pipefail

          raw_tag="$RELEASE_INPUT_TAG"
          tag="${raw_tag#refs/tags/}"
          version="${tag#v}"
          repository_version="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release tag is not a valid version tag: $tag" >&2
            exit 1
          fi

          if [[ "$version" != "$repository_version" ]]; then
            echo "tag version $version does not match VERSION $repository_version" >&2
            exit 1
          fi

          awk -v header="## $version" '
            index($0, header) == 1 && substr($0, length(header) + 1, 1) == " " {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "no changelog entry found for $version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared release $tag"

        name: Validate Release Version

        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        name: Upload Release Notes

        with:
          name: toen-release-notes-${{ steps.release.outputs.version }}
          path: release-notes.md
          if-no-files-found: error
