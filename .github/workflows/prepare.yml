name: Prepare Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

      tag:
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: read

jobs:
  release:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout Release Ref

        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - id: release
        run: |
          set -euo pipefail

          raw_tag="$RELEASE_INPUT_TAG"
          tag="${raw_tag#refs/tags/}"

          if ! git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            echo "release tag $tag does not exist in the checked-out repository" >&2
            exit 1
          fi

          version="${tag#v}"
          bash scripts/release-notes.sh "$tag" release-notes.md

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared release $tag"

        name: Validate Release Version

        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        name: Upload Release Notes

        with:
          name: toen-release-notes-${{ steps.release.outputs.version }}
          path: release-notes.md
          if-no-files-found: error
